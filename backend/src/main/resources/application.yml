server:
  port: 8080

spring:
  application:
    name: tean-server
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/tean?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true}
    username: ${DB_USER:tean}
    password: ${DB_PASS:tean_secret}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASS:}
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss

tean:
  token-ttl-hours: 12
  # 检验临期阈值（天）
  inspection-due-days: 30
